# bitcoin.conf for Bitcoin Knots 29.4.3 behind a Lightning node
# https://cesspool.lol/check/
#
# The recommended Knots file with three lines changed,
# subdustfeepenalty=0, mempooltruc=enforce and
# permitephemeral=anchor,-send,dust, and the dust fee settings written
# out at their defaults. A Lightning node that opens zero-fee commitment
# channels needs the three lines: LDK 0.2 and later can open them
# between LDK peers, eclair 0.14 has them as an option that is off by
# default, and LND 0.21 and CLN 26.06 show no sign of them. Everything
# else Lightning sends, force closes of anchor channels with their
# 330-sat anchors, the fee bump that spends an anchor, HTLC-timeout
# spends and mutual closes, already relays with the recommended file,
# apart from the OP_RETURN close and the LND penalty spend noted below,
# so a node that does not open those channels does not need this one.
#
# The commitment transaction of a zero-fee commitment channel is version
# 3, pays no fee itself beyond a trimmed remainder, and carries one
# pay-to-anchor output of at most 240 sat, zero unless a trimmed output
# or rounding leaves something in it; a child spends the anchor and pays
# for both. Knots' default subdustfeepenalty=1 takes the anchor's dust
# shortfall, 240 sat for an empty anchor, off the parent's fee, which
# must be exactly zero for a transaction with a dust output, so the
# parent is refused: "dust, tx with dust output must be 0-fee". With the
# penalty off, mempooltruc=accept still holds the parent to the 1 sat/vB
# relay floor on its own: "min relay fee not met". And the default
# permitephemeral=anchor,-send,-dust refuses an anchor holding a trimmed
# amount, 1 to 239 sat: "dust-nonzero". All three lines are needed. Core
# 29 relays these packages and LDK's 0.2 release notes say a path of
# Core 29 nodes to a miner is required; with these three lines Knots
# relays them too. Two Knots pull requests on the first two settings,
# #438 and #447, are open.
#
# What the three lines let through that the recommended file refuses: a
# version 3 transaction that pays less than the 1 sat/vB relay floor on
# its own, nothing or some fee under it, with at most one pay-to-anchor
# output under its dust limit, when it arrives with a version 3 child
# that pays the floor for both and spends the anchor if there is one.
# The child pays on the same sizing as any other transaction here, so
# data in the parent still costs 2 vbytes a byte, and every other
# setting in this file applies to both. TRUC enforcement also caps the
# parent at 10,000 vbytes and the child at 1,000, with no other
# unconfirmed parent or child, and refuses an unconfirmed chain that
# mixes version 3 with other versions, as Core does. From block 961640
# to 978047 (3,878,328 transactions, not counting coinbases) nothing
# mined is relayed by this file and refused by the recommended one: no
# mined transaction had a pay-to-anchor output under 240 sat, and the 37
# version 3 transactions mined paying less than the floor on their own,
# every one of them paying nothing, each lack a version 3 child paying
# the floor for both, so a miner took them directly.
#
# Do not raise dustrelayfee or turn on dustdynamic on this node. Anchor
# channels put two 330-sat anchors on every commitment transaction, and
# any dustrelayfee above the default 0.00003 makes 330 sat dust, and
# from there Knots refuses every anchor force close; a force close that
# misses its deadline can lose the payments in flight in that channel. A
# fee-paying child does not help; dust is not a fee failure.
#
# The datacarriersize of 42 refuses one Lightning transaction the Knots
# default of 83 relays: a mutual close that burns a balance too small to
# pay out into an OP_RETURN script longer than 42 bytes, which is a push
# of more than 40. The spec lets a side do that with a push of 6 to 80
# bytes; raise the value to 83 if your node does.
#
# With this file Knots 29.4.3 refuses the penalty spend of an LND simple
# taproot channel: the channel's revocation leaf pushes a 32-byte key
# and drops it, and Knots counts those 34 bytes as non-standard data.
# Plumb relays it since plumb9 (knots#487). From block 961640 to 978047,
# 223 mined transactions spent a leaf of that form, every one of them
# carrying a JSON token message.
#
# Knots' spam filter settings are written out so that a corepolicy=1 set
# elsewhere can no longer reset them. The comments above some of the
# defaults say what they refuse that is not spam. Knots' Spam filtering
# tab also has fee, rate-limit, package-size, unknown-witness and
# bare-anchor settings; this file leaves those alone. A corepolicy=1 set
# elsewhere still changes settings this file does not set, such as the
# minimum relay fee.
#
# If your bitcoin.conf already sets one of these options, or turns one
# off with a no line such as nodatacarrier=1, change or remove that line
# rather than adding a second one: with two lines, which one wins
# depends on their order and form. A line under [main] wins over lines
# outside it. settings.json and bitcoin_rw.conf in the data directory,
# where the Knots GUI saves its settings, win over this file, as does
# the command line. Restart the node after editing.

corepolicy=0
acceptnonstdtxn=0
rejecttokens=1
rejectparasites=1
rejectdeadbranches=1
rejectbpub=1
# The Knots default is 1, which refuses the zero-fee commitment package
# described above. Off, a pay-to-anchor output under its dust limit no
# longer counts against the fee of the transaction that creates it. It
# is the only dust output Knots permits at all: permitephemeral below
# keeps every other dust output refused, with or without this line.
subdustfeepenalty=0
# The Knots default is accept, which treats a version 3 transaction like
# any other and holds it to the relay floor on its own. enforce is the
# Core default: a version 3 parent may pay nothing when its child pays
# for both, and in return it gets at most one unconfirmed parent or
# child, 10,000 vbytes for the parent and 1,000 for the child.
mempooltruc=enforce
datacarrier=1
# The default is 83; Plumb's is 42. From block 961640 to 976619
# (3,569,710 transactions, not counting coinbases), cesspool.lol lists
# 109,247 as sewage, graded at Plumb 9's defaults. With the other
# options at their defaults, Knots refuses 25,786 of them at 83 and
# 107,654 at 42. The 81,868 that 42 adds are 41,780 swap memos, 36,519
# text or binary notes, 1,458 Stacks commitments, 1,158 Babylon and 83
# Core DAO staking tags, 859 JSON token messages and 11 BIP47
# notifications. 42 refuses nothing else in those blocks, and keeps
# 32-byte commitments such as OpenTimestamps.
datacarriersize=42
datacarrierfullcount=1
# The default is 1. At 2, each byte of data counts as 2 vbytes instead
# of 1 when the node sizes a transaction for relay and for the blocks it
# builds, so data pays twice the fee per byte.
datacarriercost=2
# The default. It refuses data outside OP_RETURN, which includes a push
# that a script drops unused. In the same blocks it also refuses 5
# Rootstock PowPeg spends of Flyover deposits, whose scripts start with
# a 32-byte value dropped that way. cesspool.lol does not count those as
# sewage: https://cesspool.lol/about/#bar.
acceptnonstddatacarrier=0
# The default. It refuses a transaction whose only output is an
# OP_RETURN. In the same blocks it also refuses 279 sweeps of Lightning
# anchors and other dust into fees, whose OP_RETURN holds 4 bytes or
# less of padding. cesspool.lol does not count those as sewage.
permitbaredatacarrier=0
permitbarepubkey=0
permitbaremultisig=0
# The Knots default is anchor,-send,-dust: the only dust output it
# permits is a pay-to-anchor worth exactly zero. dust adds a
# pay-to-anchor holding less than its dust limit, which a zero-fee
# commitment carries when the channel trimmed a small output into it.
# send stays off, so no other output type is relayed as dust. The
# transaction must still pay no fee of its own, and the child must still
# spend the anchor.
permitephemeral=anchor,-send,dust
# The default, sized for a 15-of-15 multisig spend. A lower value would
# refuse the fake multisig below, but it also refuses every ordinary
# multisig spend bigger than the value: at 590 it refuses 0 sewage
# transactions and 552 that are not, nearly all multisig, some as large
# as 1,609 bytes.
maxscriptsize=1650
maxtxlegacysigops=2500
bytespersigop=20
# The default is 20. Knots counts signature checks in a multisig script:
# one for each key in segwit, four for each key in plain P2SH, 20 for
# any multisig over 16 keys. It refuses a transaction with fewer than
# this many weight units for each check. In segwit each signature adds
# about 72, so a 2-of-3 P2WSH spend has about 139 for each check and a
# segwit 2-of-15 about 55. Fake multisig, one signature for 15 keys of
# which 14 are data, comes in at about 50. Other multisig with many keys
# and few signatures can fall below 51 too, such as a segwit 2-of-17
# spending many coins; none did in these blocks. In the same blocks
# cesspool.lol lists 700 fake multisig transactions, and Knots 29.4.3
# refuses all 700 at the defaults, counting the keys no signature uses
# (knots#422) and refusing the BPUB file format outright (knots#463). 51
# would refuse 675 of them on its own and nothing else; nothing that is
# not sewage is refused below 56. It stays as a second check that
# depends on neither the key count nor the file format: a reveal with
# ten or fewer unused keys in each script and no BPUB header passes both
# Knots rules. https://cesspool.lol/check/#fake-multisig says more.
bytespersigopstrict=51
# The defaults, written out. Anything above 0.00003 makes 330-sat
# anchors dust; see the note at the top.
dustrelayfee=0.00003
dustdynamic=off
