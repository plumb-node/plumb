# Recommended bitcoin.conf for Bitcoin Knots 29.4.2
# https://cesspool.lol/check/
#
# Knots' spam filter settings, written out so that a corepolicy=1 set
# elsewhere can no longer reset them. Three are stricter than the
# defaults, datacarriersize, datacarriercost and bytespersigopstrict;
# the comment above each says what it does. The comments above some of
# the defaults say what they refuse that is not spam. Knots' Spam
# filtering tab also has fee, dust, rate-limit, package-size,
# unknown-witness and bare-anchor settings; this file leaves those
# alone. A corepolicy=1 set elsewhere still changes settings this file
# does not set, such as the minimum relay fee.
#
# If your bitcoin.conf already sets one of these options, or turns one
# off with a no line such as nodatacarrier=1, change or remove that line
# rather than adding a second one: with two lines, which one wins
# depends on their order and form. A line under [main] wins over lines
# outside it. settings.json and bitcoin_rw.conf in the data directory,
# where the Knots GUI saves its settings, win over this file, as does
# the command line. Restart the node after editing.

corepolicy=0
acceptnonstdtxn=0
rejecttokens=1
rejectparasites=1
# The default. With it, and with mempooltruc at its default, a fee-free
# version 3 transaction with a zero-value pay-to-anchor output is
# refused even beside a child that pays its fee: the package Lightning's
# zero-fee commitment channels use. It relays only with
# subdustfeepenalty=0 and mempooltruc=enforce together. None was mined
# from block 961640 to 976619.
subdustfeepenalty=1
datacarrier=1
# The default is 83; Plumb's is 42. From block 961640 to 976619
# (3,569,710 transactions, not counting coinbases), cesspool.lol lists
# 109,246 as sewage, graded at Plumb 7's defaults. With the other
# options at their defaults, Knots refuses 25,072 of them at 83 and
# 106,941 at 42. The 81,869 that 42 adds are 41,780 swap memos, 36,520
# text or binary notes, 1,458 Stacks commitments, 1,158 Babylon and 83
# Core DAO staking tags, 859 JSON token messages and 11 BIP47
# notifications. 42 refuses nothing else in those blocks, and keeps
# 32-byte commitments such as OpenTimestamps.
datacarriersize=42
datacarrierfullcount=1
# The default is 1. At 2, each byte of data counts as 2 vbytes instead
# of 1 when the node sizes a transaction for relay and for the blocks it
# builds, so data pays twice the fee per byte.
datacarriercost=2
# The default. It refuses data outside OP_RETURN, which includes a push
# that a script drops unused. In the same blocks it also refuses 5
# Rootstock PowPeg spends of Flyover deposits, whose scripts start with
# a 32-byte value dropped that way. cesspool.lol does not count those as
# sewage: https://cesspool.lol/about/#bar.
acceptnonstddatacarrier=0
# The default. It refuses a transaction whose only output is an
# OP_RETURN. In the same blocks it also refuses 279 sweeps of Lightning
# anchors and other dust into fees, whose OP_RETURN holds 4 bytes or
# less of padding. cesspool.lol does not count those as sewage.
permitbaredatacarrier=0
permitbarepubkey=0
permitbaremultisig=0
permitephemeral=anchor,-send,-dust
# The default, sized for a 15-of-15 multisig spend. A lower value would
# refuse the fake multisig below, but it also refuses every ordinary
# multisig spend bigger than the value: at 590 it refuses 316 sewage
# transactions and 552 that are not, nearly all multisig, some as large
# as 1,609 bytes.
maxscriptsize=1650
maxtxlegacysigops=2500
bytespersigop=20
# The default is 20. Knots counts signature checks in a multisig script:
# one for each key in segwit, four for each key in plain P2SH, 20 for
# any multisig over 16 keys. It refuses a transaction with fewer than
# this many weight units for each check. In segwit each signature adds
# about 72, so a 2-of-3 P2WSH spend has about 139 for each check and a
# segwit 2-of-15 about 55. Fake multisig, one signature for 15 keys of
# which 14 are data, comes in at about 50. Other multisig with many keys
# and few signatures can fall below 51 too, such as a segwit 2-of-17
# spending many coins; none did in these blocks. In the same blocks
# cesspool.lol lists 700 fake multisig transactions, and Knots relays
# all of them at the defaults. 51 refuses 675 of them and nothing else;
# nothing that is not sewage is refused below 56.
# https://cesspool.lol/check/#fake-multisig says more.
bytespersigopstrict=51
