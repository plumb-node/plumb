# Recommended bitcoin.conf for Bitcoin Knots 29.4.2
# https://cesspool.lol/check/
#
# Knots' spam filter settings, written out so that a corepolicy=1 set
# elsewhere can no longer reset them. Two are stricter than the
# defaults, datacarriersize and datacarriercost; the comment above each
# says what it does. Knots' Spam filtering tab also has fee, dust,
# rate-limit, package-size, unknown-witness and bare-anchor settings;
# this file leaves those alone. A corepolicy=1 set elsewhere still
# changes settings this file does not set, such as the minimum relay
# fee.
#
# If your bitcoin.conf already sets one of these options, or turns one
# off with a no line such as nodatacarrier=1, change or remove that line
# rather than adding a second one: with two lines, which one wins
# depends on their order and form. A line under [main] wins over lines
# outside it. settings.json and bitcoin_rw.conf in the data directory,
# where the Knots GUI saves its settings, win over this file, as does
# the command line. Restart the node after editing.

corepolicy=0
acceptnonstdtxn=0
rejecttokens=1
rejectparasites=1
subdustfeepenalty=1
datacarrier=1
# The default is 83. From block 961640, the first BLAKE2b block, to
# 976619 (3,569,710 transactions, not counting coinbases), cesspool.lol
# lists 28,543 as sewage. With the other options at their defaults,
# Knots refuses 25,356 of them at 83 and 26,237 at 42. Plumb refuses
# 28,542 at either value. 42 also refuses 80,988 transactions that are
# not on that list, each carrying one OP_RETURN: a text or binary note,
# a swap memo or a Stacks commitment.
datacarriersize=42
datacarrierfullcount=1
# The default is 1. At 2, each byte of data counts as 2 vbytes instead
# of 1 when the node sizes a transaction for relay and for the blocks it
# builds, so data pays twice the fee per byte.
datacarriercost=2
acceptnonstddatacarrier=0
permitbaredatacarrier=0
permitbarepubkey=0
permitbaremultisig=0
permitephemeral=anchor,-send,-dust
maxscriptsize=1650
maxtxlegacysigops=2500
bytespersigop=20
bytespersigopstrict=20
