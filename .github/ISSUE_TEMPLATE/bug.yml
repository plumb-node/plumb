name: Bug report
description: Something in Plumb does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for problems in Plumb. A security problem goes through [SECURITY.md](https://github.com/plumb-node/plumb/security/policy), not here. If the problem also happens on the Bitcoin Knots release underneath, report it to Knots as well: https://github.com/bitcoinknots/bitcoin/issues
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      options:
      - label: I have searched the existing issues
        required: true
  - type: textarea
    id: current-behaviour
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Options in bitcoin.conf or on the command line, and what you did.
    validations:
      required: true
  - type: textarea
    id: filters
    attributes:
      label: Plumb lines from debug.log
      description: The output of `grep "Plumb" ~/.bitcoin/debug.log | tail -6`, which shows the version and which filters are on.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Other relevant log output
      description: Trim it to the lines that matter. debug.log can contain addresses and paths that identify you.
      render: text
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: e.g. Ubuntu 24.04 LTS
    validations:
      required: true
